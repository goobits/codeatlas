openapi: 3.1.0
info:
  title: HTTP fixture
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        "204":
          description: Ready
  /widgets/{id}:
    post:
      operationId: updateWidget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
        "400":
          description: Invalid widget request
components:
  schemas:
    WidgetUpdate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 128
    Widget:
      allOf:
        - $ref: "#/components/schemas/WidgetUpdate"
        - type: object
          required:
            - id
          properties:
            id:
              type: string
