[package]
name = "codeatlas"
version = "0.4.0"
edition = "2021"
description = "Map, document, and diff public API surfaces across source languages"
license-file = "LICENSE"
repository = "https://github.com/goobits/codeatlas"

[dependencies]
# CLI & Error Handling
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
regex = "1.10"
colored = "2.0"

# Rust Parsing
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }

# Python Parsing
rustpython-parser = { version = "0.3", features = ["location"] }
rustpython-ast = "0.3"

# TypeScript/JS Parsing (via swc_core to ensure version alignment)
swc_core = { version = "0.91.1", features = ["ecma_parser", "ecma_ast", "ecma_visit", "common", "common_tty"] }

# Utilities
pathdiff = "0.2"
rayon = "1.10"
