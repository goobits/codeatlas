[package]
name = "codeatlas"
version = "0.7.1"
edition = "2021"
description = "Map source code and compile declared architecture across languages"
license-file = "LICENSE"
repository = "https://github.com/goobits/codeatlas"

[dependencies]
# CLI & Error Handling
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
cargo_metadata = "0.18"
ctrlc = "3.4"
thiserror = "1.0"
serde = { version = "=1.0.196", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9"
jsonschema = { version = "0.48", default-features = false }
walkdir = "2.4"
ignore = "0.4"
globset = "0.4"
json5 = "0.4"
regex = "1.10"
colored = "2.0"
pulldown-cmark = "0.13"
base64 = "0.22"
sha2 = "0.10"
url = "2.5"

# Rust Parsing
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }

# Python Parsing
rustpython-parser = { version = "0.3", features = ["location"] }
rustpython-ast = { version = "0.3", features = ["visitor"] }
toml = "0.8"

# TypeScript/JS Parsing (via swc_core to ensure version alignment)
swc_core = { version = "0.91.1", features = ["ecma_parser", "ecma_ast", "ecma_visit", "common", "common_tty"] }

# Utilities
pathdiff = "0.2"
rayon = "1.10"
