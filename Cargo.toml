[package]
name = "codeatlas"
version = "0.10.0"
edition = "2021"
description = "Map source code and compile declared architecture across languages"
license-file = "LICENSE"
repository = "https://github.com/goobits/codeatlas"

[workspace]
members = ["crates/domain", "crates/source", "crates/languages"]
exclude = ["crates/isolation-conformance"]
resolver = "2"

[workspace.dependencies]
schemars = "=1.2.2"
serde = { version = "=1.0.196", features = ["derive"] }
thiserror = "1.0"

[dependencies]
# CLI & Error Handling
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
codeatlas-domain = { path = "crates/domain" }
codeatlas-languages = { path = "crates/languages" }
codeatlas-source = { path = "crates/source" }
codeatlas-isolation-conformance = { path = "crates/isolation-conformance" }
ctrlc = "3.4"
thiserror.workspace = true
serde.workspace = true
serde_json = "1.0.143"
serde_json_canonicalizer = "=0.3.2"
serde_yaml = "0.9"
jsonschema = { version = "0.48", default-features = false }
walkdir = "2.4"
ignore = "0.4"
globset = "0.4"
regex = "1.10"
colored = "2.0"
pulldown-cmark = "0.13"
base64 = "0.22"
sha2 = "0.10"
url = "2.5"
bytes = "1.10"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.47", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

toml = "0.8"

# PostgreSQL's domain-specific ECMAScript SQL collector retains direct SWC use.
swc_core = { version = "0.91.1", features = ["ecma_parser", "ecma_ast", "ecma_visit", "common", "common_tty"] }

# Utilities
percent-encoding = "2.3"
schemars.workspace = true

[dev-dependencies]
tokio = { version = "1.47", features = ["test-util"] }
