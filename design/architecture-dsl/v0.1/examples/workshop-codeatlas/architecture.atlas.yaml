    decision:
      status: accepted
      authority:
        governing:
          - kind: released-api
            artifact:
              id: codeatlas.api.context-slice
              version: 1
        supporting: []
    approval:
      status: granted
    changeControl:
      policy: versioned_successor_only

  codeatlas.relation.provider-implements-context-contract:
    predicate: implements
    subject: codeatlas.provider.codeatlas
    object: codeatlas.contract.context-slice-v1
    decision:
      status: accepted
      authority:
        governing:
          - kind: released-api
            artifact:
              id: codeatlas.api.context-slice
              version: 1
        supporting: []
    approval:
      status: granted
    changeControl:
      policy: versioned_successor_only

  goobits.relation.workshop-consumes-context:
    predicate: consumes
    subject: goobits.package.workshop-core
    object: codeatlas.capability.context-slice
    decision:
      status: accepted
      authority:
        governing:
          - kind: owner-decision
            artifact:
              id: goobits.decision.workshop-codeatlas-consumer
              version: 1
        supporting: []
    approval:
      status: granted
    changeControl:
      policy: owner_approval_required

  goobits.relation.access-governs-authorization:
    predicate: governs
    subject: goobits.package.access
    object: goobits.effect.authorization
    decision:
      status: accepted
      authority:
        governing:
          - kind: package-contract
            artifact:
              id: goobits.contract.access
              version: 1
        supporting: []
    approval:
      status: granted
    changeControl:
      policy: versioned_successor_only

  goobits.relation.commit-owner-implements-commit:
    predicate: implements
    subject: goobits.provider.commit-owner
    object: goobits.capability.git-commit
    decision:
      status: accepted
      authority:
        governing:
          - kind: package-contract
            artifact:
              id: goobits.contract.commit-owner
              version: 1
        supporting: []
    approval:
      status: granted
    changeControl:
      policy: versioned_successor_only

  goobits.relation.workshop-defines-coordination:
    predicate: defines
    subject: goobits.package.workshop-core
    object: goobits.concept.work-coordination
    decision:
      status: accepted
      authority:
        governing:
          - kind: owner-decision
            artifact:
              id: goobits.decision.workshop-coordination
              version: 1
        supporting: []
    approval:
      status: granted
    changeControl:
      policy: owner_approval_required

bindings:
  codeatlas.binding.provider-crate:
    target: codeatlas.provider.codeatlas
    adapter:
      kind: rust.crate
      version: 1
    selector:
      name: codeatlas
    cardinality: exactly_one
    decision:
      status: accepted
      authority:
        governing:
          - kind: package-contract
            artifact:
              id: codeatlas.contract.rust-crate
              version: 1
        supporting: []
    approval:
      status: granted
    changeControl:
      policy: versioned_successor_only

constraints:
  goobits.constraint.codeatlas-independent-of-workshop:
    rule: no_path
    severity: error
    arguments:
      from: codeatlas.provider.codeatlas
      to: goobits.package.workshop-core
      via:
        - depends_on
    decision:
      status: accepted
      authority:
        governing:
          - kind: owner-decision
            artifact:
              id: goobits.decision.codeatlas-independent
              version: 1
        supporting: []
    approval:
      status: granted
    changeControl:
      policy: owner_approval_required

  goobits.constraint.workshop-does-not-govern-access:
    rule: forbids_relation
    severity: error
    arguments:
      predicate: governs
      subject: goobits.package.workshop-core
      object: goobits.effect.authorization
    decision:
      status: accepted
      authority:
        governing:
          - kind: owner-decision
            artifact:
              id: goobits.decision.workshop-access-boundary
              version: 1
        supporting: []
    approval:
