name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --check
      - run: cargo test --locked --jobs 1
      - run: cargo clippy --all-targets --jobs 1 -- -D warnings
      - run: cargo build --locked --jobs 1
      - name: Smoke Node wrapper
        shell: bash
        run: CODEATLAS_BINARY_PATH="$PWD/target/debug/codeatlas${{ runner.os == 'Windows' && '.exe' || '' }}" node bin/codeatlas.js --version
      - run: pnpm run pack:check
