[package]
name = "codeatlas-languages"
version = "0.10.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
cargo_metadata = "0.18"
codeatlas-domain = { path = "../domain" }
codeatlas-source = { path = "../source" }
globset = "0.4"
json5 = "0.4"
pathdiff = "0.2"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
rayon = "1.10"
regex = "1.10"
rustpython-ast = { version = "0.3", features = ["visitor"] }
rustpython-parser = { version = "0.3", features = ["location"] }
schemars.workspace = true
serde.workspace = true
serde_json = "1.0.143"
swc_core = { version = "0.91.1", features = ["ecma_parser", "ecma_ast", "ecma_visit", "common", "common_tty"] }
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
walkdir = "2.4"
