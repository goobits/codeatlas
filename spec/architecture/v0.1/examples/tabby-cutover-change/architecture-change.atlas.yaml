apiVersion: atlas.codeatlas.dev/v0.1
kind: ArchitectureChange

metadata:
  id: goobits.change.tabby-lifecycle-cutover
  name: Tabby lifecycle cutover
  architectureVersion: 2
  description: Proposed replacement of duplicated Shelly tab lifecycle.
  maintainers:
    - goobits.team.platform

vocabulary:
  id: codeatlas.architecture.core
  version: 2
  digest: sha256:3bac4c67293af8927b882f3f591c812206c7248e713602592450e9c076ffdc30

baseGraphDigest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

change:
  type: REPLACE

decision:
  status: proposed
  authority:
    governing: []
    supporting:
      - kind: owner-direction
        artifact:
          id: goobits.owner-direction.tab-root-space
          version: 1

approval:
  status: required

changeControl:
  policy: accepted_adr_required

affectedIds:
  - goobits.lifecycle.shelly-tab
  - goobits.runtime.tab-root-space

currentOwner: goobits.app.shelly
intendedOwner: goobits.app.tabby

expectedEffects:
  adds:
    - goobits.runtime.tab-root-space
  removes:
    - goobits.lifecycle.shelly-tab
  requires:
    - constraint: goobits.constraint.one-tab-root-governor
      result: pass

migrationPlan:
  - Establish the accepted Tabby lifecycle contract.
  - Migrate Shelly to the shared tab-host capability.
  - Verify state and identity preservation.

removalPlan:
  - Retire goobits.lifecycle.shelly-tab.
  - Delete the old Shelly tab mutation path.
  - Remove temporary compatibility code.

verificationPlan:
  - Compile the new governing graph.
  - Prove the one-governor constraint.
  - Prove no legacy authoritative path remains.

